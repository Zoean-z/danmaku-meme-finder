[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "danmaku-meme-finder"
version = "0.1.0"
description = "A local MVP for finding candidate memes in Douyu danmaku."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
danmaku-meme-finder = "danmaku_meme_finder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/danmaku_meme_finder"]
